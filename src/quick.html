<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src app:; style-src app: 'unsafe-inline'; font-src app:; img-src app: data:;">
<title>TextVault Quick Clipboard</title>
<link rel="stylesheet" href="styles/theme.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/views.css">
<link rel="stylesheet" href="styles/quick.css">
</head>
<body class="quick-body">
<div class="quick" id="quick">
  <div class="quick-search">
    <span class="search-icon" data-icon="search"></span>
    <input id="quick-input" type="text" placeholder="Search clipboard…" aria-label="Search clipboard" data-i18n-ph="clip.search" data-i18n-aria="clip.search" autocomplete="off" spellcheck="false">
    <kbd class="kbd">Esc</kbd>
  </div>
  <div class="quick-results" id="quick-results"></div>
  <div class="quick-footer">
    <span><kbd>↑</kbd><kbd>↓</kbd> <span data-i18n="quick.navigate">Navigate</span></span>
    <span><kbd>Enter</kbd> <span data-i18n="quick.use">Copy</span></span>
    <span><kbd>Esc</kbd> <span data-i18n="quick.close">Close</span></span>
  </div>
</div>
<div id="toast-root"></div>
<script type="module" src="js/quick.js"></script>
</body>
</html>
