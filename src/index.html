<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src app:; style-src app: 'unsafe-inline'; font-src app:; img-src app: data:;">
<title>TextVault</title>
<link rel="stylesheet" href="styles/theme.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/views.css">
</head>
<body>
<div id="app" class="app" data-view="dashboard">

  <!-- ======================= Sidebar ======================= -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">TextVault</span>
        <span class="brand-sub" id="brand-version">v1.0</span>
      </div>
      <button class="icon-btn" id="theme-quick-toggle" title="Toggle theme (Ctrl+Alt+T)" data-i18n-title="aria.themeTitle" aria-label="Toggle theme" data-i18n-aria="aria.theme"></button>
    </div>

    <button class="btn btn-accent btn-block btn-new" id="btn-new-text">
      <span class="btn-icon" data-icon="plus"></span>
      <span data-i18n="new.text">New Text</span>
      <kbd class="kbd-accent">Ctrl N</kbd>
    </button>

    <nav class="sidebar-nav" id="sidebar-nav">
      <button class="nav-item" data-nav="clipboard">
        <span class="nav-icon" data-icon="clipboard"></span>
        <span class="nav-label" data-i18n="nav.clipboard">Clipboard</span>
        <span class="nav-count" data-count="clipboard"></span>
      </button>
      <button class="nav-item" data-nav="all">
        <span class="nav-icon" data-icon="layers"></span>
        <span class="nav-label" data-i18n="nav.all">All Texts</span>
        <span class="nav-count" data-count="all"></span>
      </button>
      <button class="nav-item" data-nav="favorites">
        <span class="nav-icon" data-icon="star"></span>
        <span class="nav-label" data-i18n="nav.favorites">Favorites</span>
        <span class="nav-count" data-count="favorites"></span>
      </button>
      <button class="nav-item" data-nav="recent">
        <span class="nav-icon" data-icon="clock"></span>
        <span class="nav-label" data-i18n="nav.recent">Recently Used</span>
      </button>
      <button class="nav-item" data-nav="collections">
        <span class="nav-icon" data-icon="layers"></span>
        <span class="nav-label" data-i18n="nav.collections">Collections</span>
        <span class="nav-count" data-count="collections"></span>
      </button>
      <button class="nav-item" data-nav="snippets">
        <span class="nav-icon" data-icon="file-text"></span>
        <span class="nav-label" data-i18n="nav.snippets">Snippets</span>
        <span class="nav-count" data-count="snippets"></span>
      </button>
      <button class="nav-item" data-nav="trash">
        <span class="nav-icon" data-icon="trash"></span>
        <span class="nav-label" data-i18n="nav.trash">Trash</span>
        <span class="nav-count" data-count="trash"></span>
      </button>
    </nav>

    <div class="sidebar-tags">
      <div class="sidebar-heading">
        <span class="nav-icon-sm" data-icon="tag"></span> <span data-i18n="nav.tags">Tags</span>
      </div>
      <div class="tag-list" id="tag-list"></div>
    </div>

    <div class="sidebar-footer">
      <button class="nav-item" data-nav="settings">
        <span class="nav-icon" data-icon="settings"></span>
        <span class="nav-label" data-i18n="nav.settings">Settings</span>
      </button>
    </div>
  </aside>

  <!-- ======================= Main column ======================= -->
  <div class="main">

    <!-- Topbar -->
    <header class="topbar" id="topbar">
      <div class="searchbox">
        <span class="search-icon" data-icon="search"></span>
        <input id="search-input" type="text" placeholder="Search titles, content, tags…" data-i18n-ph="search.placeholder" autocomplete="off" spellcheck="false">
        <kbd class="kbd">Ctrl F</kbd>
        <button class="icon-btn icon-btn-sm search-clear hidden" id="search-clear" title="Clear" data-i18n-title="aria.clear" data-icon-x></button>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="btn-select-mode" title="Selection mode — click cards to select them" data-i18n-title="select.mode"></button>
        <div class="select-wrap" id="sort-wrap" title="Sort" data-i18n-title="sort.label">
          <span class="select-icon" data-icon="sort"></span>
          <select id="sort-select" aria-label="Sort by" data-i18n-aria="aria.sortBy">
            <option value="modified-desc" data-i18n="sort.modified">Recently Modified</option>
            <option value="created-desc" data-i18n="sort.createdDesc">Newest Created</option>
            <option value="created-asc" data-i18n="sort.createdAsc">Oldest Created</option>
            <option value="used-desc" data-i18n="sort.used">Recently Used</option>
            <option value="title-asc" data-i18n="sort.titleAsc">Title A → Z</option>
            <option value="title-desc" data-i18n="sort.titleDesc">Title Z → A</option>
          </select>
        </div>
        <span class="topbar-count" id="entries-count"></span>
      </div>
    </header>

    <!-- View: Dashboard -->
    <section class="view view-dashboard" id="view-dashboard">
      <div class="quickcapture card-raised" id="quickcapture">
        <span class="qc-icon" data-icon="clipboard"></span>
        <textarea id="qc-input" class="qc-input" rows="1" placeholder="Quick capture — paste text here, then press Ctrl+Enter to save…" data-i18n-ph="qc.placeholder" spellcheck="false"></textarea>
        <div class="qc-actions">
          <button class="btn btn-ghost btn-sm" id="qc-paste" title="Paste from clipboard" data-i18n-title="qc.pasteTip"><span class="btn-icon" data-icon="download"></span><span data-i18n="qc.paste">Paste</span></button>
          <button class="btn btn-accent btn-sm" id="qc-save"><span class="btn-icon" data-icon="save"></span><span data-i18n="qc.save">Save</span>&nbsp;<kbd class="kbd-accent">Ctrl ↵</kbd></button>
        </div>
      </div>

      <div class="selection-toolbar hidden" id="selection-toolbar">
        <span class="sel-mode-badge" data-icon="check"></span>
        <span class="sel-mode-label" data-i18n="selection.mode">Selection Mode</span>
        <span class="sel-count" id="sel-count">0 selected</span>
        <span class="spacer"></span>
        <button class="btn btn-ghost btn-sm" id="sel-all" data-i18n="select.all">Select All</button>
        <button class="btn btn-ghost btn-sm" id="sel-clear" data-i18n="select.clear">Clear Selection</button>
        <button class="btn btn-ghost btn-sm" id="sel-cancel" data-i18n="select.cancel">Cancel</button>
      </div>

      <div class="dashboard-body">
        <div class="virtual-grid" id="card-grid">
          <div class="grid-inner" id="grid-inner"></div>
          <div class="empty-state hidden" id="dashboard-empty"></div>
          <div class="search-progress hidden" id="search-progress"><div class="spinner"></div><span data-i18n="search.progress">Searching…</span></div>
        </div>
      </div>

      <div class="bulkbar hidden" id="bulkbar"></div>
    </section>

    <!-- View: Clipboard history -->
    <section class="view view-clipboard hidden" id="view-clipboard">
      <div class="clip-head">
        <h2 class="view-title" data-i18n="clip.title">Clipboard</h2>
        <span class="clip-status" id="clip-status">
          <span class="clip-dot"></span>
          <span class="clip-status-text" data-i18n="clip.monitoring.active">Monitoring active</span>
        </span>
        <span class="spacer"></span>
        <button class="btn btn-ghost btn-sm" id="clip-pause" data-i18n="clip.pause">Pause</button>
        <button class="btn btn-ghost-danger btn-sm" id="clip-clear" data-i18n="clip.clear">Clear History</button>
      </div>
      <div class="clip-search">
        <span class="search-icon" data-icon="search"></span>
        <input id="clip-search-input" type="text" placeholder="Search clipboard history…" data-i18n-ph="clip.search" autocomplete="off" spellcheck="false">
      </div>
      <div class="clip-list" id="clip-list"></div>
      <div class="empty-state hidden" id="clipboard-empty"></div>
    </section>

    <!-- View: Snippets -->
    <section class="view view-snippets hidden" id="view-snippets">
      <div class="clip-head">
        <h2 class="view-title" data-i18n="sn.title">Snippets</h2>
        <span class="topbar-count" id="snippet-count"></span>
        <span class="spacer"></span>
        <button class="btn btn-accent btn-sm" id="btn-new-snippet"><span class="btn-icon" data-icon="plus"></span><span data-i18n="sn.new">New Snippet</span></button>
      </div>
      <div class="clip-search">
        <span class="search-icon" data-icon="search"></span>
        <input id="snippet-search-input" type="text" placeholder="Search snippets…" data-i18n-ph="sn.search" autocomplete="off" spellcheck="false">
      </div>
      <div class="clip-list" id="snippet-list"></div>
      <div class="empty-state hidden" id="snippets-empty"></div>
    </section>

    <!-- View: Collections -->
    <section class="view view-collections hidden" id="view-collections">
      <div class="clip-head">
        <h2 class="view-title" data-i18n="col.title">Collections</h2>
        <span class="spacer"></span>
        <button class="btn btn-accent btn-sm" id="btn-new-collection"><span class="btn-icon" data-icon="plus"></span><span data-i18n="col.new">New Collection</span></button>
      </div>
      <div class="clip-list" id="collection-list"></div>
      <div class="empty-state hidden" id="collections-empty"></div>
    </section>

    <!-- View: Editor -->
    <section class="view view-editor hidden" id="view-editor">
      <div class="editor-top">
        <button class="icon-btn" id="editor-back" title="Back (Esc)" data-i18n-title="ed.back" data-icon="arrow-left"></button>
        <div class="editor-titlewrap">
          <input id="editor-title" class="editor-title" placeholder="Untitled" data-i18n-ph="exp.untitled" autocomplete="off" spellcheck="false">
          <div class="editor-save-state" id="save-state"><span class="dot"></span><span class="txt" data-i18n="ed.saveState.saved">Saved</span></div>
        </div>
        <div class="editor-actions">
          <div class="seg" id="dir-seg" title="Text direction" data-i18n-title="ed.dir">
            <button data-dir="auto" class="active" data-i18n="ed.dirAuto">Auto</button>
            <button data-dir="rtl">RTL</button>
            <button data-dir="ltr">LTR</button>
          </div>
          <button class="icon-btn" id="btn-color" title="Card color label" data-i18n-title="ed.color"></button>
          <button class="icon-btn" id="btn-find-toggle" title="Find & Replace (Ctrl+F)" data-i18n-title="ed.findReplace"></button>
          <button class="icon-btn" id="btn-copy-all" title="Copy all (Ctrl+Shift+C)" data-i18n-title="ed.copyAllTitle"></button>
          <button class="icon-btn" id="btn-fav" title="Favorite" data-i18n-title="favorite"></button>
          <div class="menu-wrap">
            <button class="icon-btn" id="btn-export" title="Export (Ctrl+E)" data-i18n-title="ed.exportTitle"></button>
            <div class="dropdown hidden" id="export-menu"></div>
          </div>
          <div class="menu-wrap">
            <button class="icon-btn" id="btn-more" title="More" data-i18n-title="ed.more"></button>
            <div class="dropdown hidden" id="more-menu"></div>
          </div>
        </div>
      </div>

      <div class="findbar hidden" id="findbar">
        <div class="findbar-row">
          <div class="find-field">
            <input id="find-input" placeholder="Find" data-i18n-ph="ed.findPh" autocomplete="off" spellcheck="false">
            <span class="find-count" id="find-count">0/0</span>
            <button class="icon-btn icon-btn-sm" id="find-prev" title="Previous (Shift+Enter)" data-i18n-title="ed.findPrev"></button>
            <button class="icon-btn icon-btn-sm" id="find-next" title="Next (Enter)" data-i18n-title="ed.findNext"></button>
            <button class="toggle-btn" id="find-case" title="Match case" data-i18n-title="ed.matchCase">Aa</button>
          </div>
          <div class="find-field">
            <input id="replace-input" placeholder="Replace with" data-i18n-ph="ed.replacePh" autocomplete="off" spellcheck="false">
            <button class="btn btn-ghost btn-sm" id="replace-one" data-i18n="ed.replaceBtn">Replace</button>
            <button class="btn btn-ghost btn-sm" id="replace-all" data-i18n="ed.allBtn">All</button>
          </div>
          <button class="icon-btn" id="findbar-close" title="Close (Esc)" data-i18n-title="ed.closeEsc"></button>
        </div>
      </div>

      <div class="editor-tags-row">
        <div class="chips" id="editor-tags"></div>
        <input id="tag-input" class="tag-input" placeholder="Add tag…" data-i18n-ph="tag.add" autocomplete="off" spellcheck="false">
        <button class="icon-btn icon-btn-sm" id="btn-tag-suggest" title="Pick from existing tags" data-i18n-title="ed.tagSuggest"></button>
        <div class="tag-suggest hidden" id="tag-suggest"></div>
      </div>

      <div class="editor-area">
        <textarea id="editor-textarea" class="editor-textarea" spellcheck="false" placeholder="Paste or type your text here…" data-i18n-ph="ed.textPh" wrap="soft"></textarea>
        <div class="dup-banner hidden" id="dup-banner"></div>
      </div>

      <div class="editor-status">
        <span id="stat-chars">0 chars</span>
        <span class="sep"></span>
        <span id="stat-words">0 words</span>
        <span class="sep"></span>
        <span id="stat-lines">0 lines</span>
        <span class="sep"></span>
        <span id="stat-pos">Ln 1, Col 1</span>
        <span class="spacer"></span>
        <button class="status-toggle" id="toggle-wrap" title="Toggle word wrap" data-i18n-title="set.wrap"><span data-i18n="ed.wrapOn">Wrap: On</span></button>
        <button class="status-toggle" id="toggle-font" title="Toggle font" data-i18n-title="set.fontFamily"><span data-i18n="ed.sans">Sans</span></button>
        <span id="stat-dir" class="stat-dir" data-i18n="ed.dirAuto">Auto</span>
      </div>
    </section>

    <!-- View: Trash -->
    <section class="view view-trash hidden" id="view-trash">
      <div class="trash-head">
        <h2 class="view-title" data-i18n="trash.title">Trash</h2>
        <button class="btn btn-ghost-danger btn-sm hidden" id="btn-empty-trash"><span class="btn-icon" data-icon="trash"></span> <span data-i18n="trash.emptyBtn">Empty Trash</span></button>
      </div>
      <div class="trash-list" id="trash-list"></div>
      <div class="empty-state hidden" id="trash-empty"></div>
    </section>

    <!-- View: Settings -->
    <section class="view view-settings hidden" id="view-settings"></section>
  </div>
</div>

<!-- Overlay roots -->
<div id="modal-root"></div>
<div id="toast-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
